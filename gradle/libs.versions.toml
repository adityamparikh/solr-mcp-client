[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
cyclonedx = "3.4.1"
sonarqube = "7.4.0.8496"
jacoco = "0.8.15"
spring-ai = "2.0.1"
# Spring Shell 4 requires Spring Boot 4+; the version feeds the spring-shell-dependencies BOM
# import in build.gradle.kts, so the starter itself stays unversioned like the other BOM-managed
# libraries.
spring-shell = "4.0.3"
springdoc = "3.1.0"
# Pre-1.0, and it sits in the auth path: McpHttpOAuth2Configuration hands it the whole job of
# attaching the outbound service token. Treat a bump as a behavioural change to be read rather than
# a routine version bump — a 0.x minor may move a default without saying so, and this library
# already documents one default in its README that its code contradicts (see application-mcp-http
# .yml, which states dynamic-client-registration rather than relying on it). 0.1.14 is the latest
# release as of 2026-08-31; check what changed before moving, and re-run
# scripts/verify-service-token.sh against a real server afterwards.
mcp-client-security = "0.1.14"
error-prone = "2.50.0"
nullaway = "0.14.1"
errorprone-plugin = "5.1.1"

[libraries]
# Version managed by the Spring Boot BOM; spring-core already depends on it, but this project
# imports the annotations directly, so the dependency is declared rather than inherited.
jspecify = { module = "org.jspecify:jspecify" }
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error-prone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-opentelemetry = { module = "org.springframework.boot:spring-boot-starter-opentelemetry" }
spring-boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
springdoc-openapi-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spring-ai-mcp-client = { module = "org.springframework.ai:spring-ai-starter-mcp-client" }
mcp-client-security = { module = "org.springaicommunity:mcp-client-security-spring-boot", version.ref = "mcp-client-security" }
spring-ai-openai = { module = "org.springframework.ai:spring-ai-starter-model-openai" }
# The -ffm flavor bundles spring-shell-jline with JLine's FFM terminal provider (JDK 22+). The
# plain starter's Console-based runner reads EOF and exits under any non-PTY stdin (IDE run
# consoles); JLine falls back to a dumb terminal there instead, which is what keeps the REPL
# usable outside a real terminal.
spring-shell-starter-ffm = { module = "org.springframework.shell:spring-shell-starter-ffm" }
spring-ai-anthropic = { module = "org.springframework.ai:spring-ai-starter-model-anthropic" }
spring-boot-actuator-test = { module = "org.springframework.boot:spring-boot-starter-actuator-test" }
spring-boot-opentelemetry-test = { module = "org.springframework.boot:spring-boot-starter-opentelemetry-test" }
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
sonarqube = { id = "org.sonarqube", version.ref = "sonarqube" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
