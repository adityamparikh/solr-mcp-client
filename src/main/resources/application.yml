spring:
  application:
    name: solr-mcp-client
  profiles:
    # Profiles select how this client REACHES the Solr MCP server, not how it serves its own API:
    # this application is a REST service in every profile. mcp-stdio is the default; activating any
    # profile explicitly replaces it, so McpToolVerifier fails fast rather than starting with zero
    # Solr MCP tools.
    default: mcp-stdio
  ai:
    # Which provider is active is decided by ChatModelProviderSelector from the API keys present in
    # the environment, before these auto-configurations are evaluated. API keys are not listed here:
    # the selector copies OPENAI_API_KEY / ANTHROPIC_API_KEY into the property Spring AI reads, so a
    # provider without a key is never activated.
    openai:
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
    anthropic:
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    mcp:
      client:
        name: solr-mcp-client
        version: 0.0.1-SNAPSHOT
        type: SYNC
        initialized: true
        request-timeout: 60s

  mvc:
    apiversion:
      # Framework-owned API versioning (Spring Framework 7). The version is the second path
      # segment, so /api/v1/chat keeps its shape while the version becomes a first-class mapping
      # dimension: an unsupported version is rejected with 400 naming the version, rather than
      # falling through to a 404 that looks like a wrong URL.
      #
      # 1.0 is the default version, so a request that resolves no version at all is served as v1
      # rather than rejected. `required` must be false for that: Spring refuses to start with
      # `required: true` and a default configured together.
      #
      # Note what this does not do. The version segment is still part of the URL template
      # (`/api/{version}` on the controller), so /api/chat is a 404 — no property relaxes a path
      # pattern — and PathApiVersionResolver returns whatever segment sits at the index rather than
      # null, so the default is not reached by dropping the segment either. Making unversioned URLs
      # resolve to v1 would need the controller mapped at both /api and /api/{version} plus an
      # ApiVersionResolver bean using PathApiVersionResolver's predicate constructor, which Spring
      # Boot does not expose as a property.
      use:
        path-segment: 1
      required: false
      default: "1.0"
      detect-supported: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
