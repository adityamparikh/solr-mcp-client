spring:
  application:
    name: solr-mcp-client
  profiles:
    # mcp-* profiles select how this client REACHES the Solr MCP server; the single `cli` profile
    # selects the inbound adapter (a Spring Shell REPL instead of the REST service — see
    # application-cli.yml). The two axes compose: cli,mcp-http is one application reached two ways.
    # mcp-stdio is the default; activating any profile explicitly replaces it (never merges), so
    # `cli` alone would drop the transport too — McpToolVerifier then fails fast rather than
    # starting with zero Solr MCP tools.
    default: mcp-stdio
  ai:
    # Which provider is active is not decided here, and not in code either: it is decided by which
    # spring-ai-starter-model-* dependency is on the classpath. Exactly one is declared in
    # build.gradle.kts — read that file for which one. A provider named here instead would go stale
    # the moment the dependency is swapped, since nothing makes the two move together; this comment
    # said "anthropic" for as long as the build said openai, and cost a reader the wrong diagnosis.
    # Spring AI auto-configures the single ChatModel it finds, and everything downstream sees only
    # ChatClient. Switching providers means swapping that dependency and exporting the matching key
    # — no property below selects anything. docs/model-providers.md covers the swap end to end,
    # including local models and the tool-calling constraint they run into.
    #
    # Both provider blocks are kept so that swap stays a one-line build change. The block for an
    # absent starter is inert — nothing binds those properties, so its ${...} placeholders are
    # never resolved and a missing key for the inactive provider cannot fail startup.
    #
    # Each key is bound at the level its own starter actually reads, which is NOT the same level for
    # the two providers — the api-key sits under `chat:` for OpenAI but a level up for Anthropic:
    #
    #   OPENAI_API_KEY    -> spring.ai.openai.chat.api-key   (OpenAiChatProperties, a per-chat
    #                        override of the common spring.ai.openai.api-key — both are bound)
    #   ANTHROPIC_API_KEY -> spring.ai.anthropic.api-key     (AnthropicConnectionProperties, the
    #                        ONLY api-key Anthropic binds — it has no chat.api-key)
    #   OPENAI_MODEL      -> spring.ai.openai.chat.model
    #   ANTHROPIC_MODEL   -> spring.ai.anthropic.chat.model
    #
    # The asymmetry is the whole point of writing it down: OpenAI exposes the key at both levels, so
    # the wrong guess still works there and teaches the wrong lesson. Anthropic exposes it at one
    # level only, and a key nested under `chat:` binds to nothing and is discarded in silence. This
    # file had exactly that bug. Verify against the starter's spring-configuration-metadata.json
    # before moving either key.
    #
    # The model keys are the flat form on purpose. Spring AI 2.0 flattened `.options.` away, so
    # spring.ai.*.chat.options.model is the DEPRECATED spelling now — do not "correct" these back.
    #
    # The api-key placeholders default to empty rather than being left to fail unresolved: an
    # unresolvable placeholder breaks every test that starts a context whenever the var is absent,
    # including contexts that never build a ChatModel at all.
    #
    # If a second starter is ever added, spring.ai.model.chat must name the winner or startup fails
    # rather than guessing. Web slice tests pin it to `none` so they do not depend on which keys a
    # developer has exported.
    openai:
      chat:
        model: ${OPENAI_MODEL:gpt-5-mini}
        api-key: ${OPENAI_API_KEY:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    mcp:
      client:
        name: solr-mcp-client
        version: 0.0.1-SNAPSHOT
        type: SYNC
        initialized: true
        request-timeout: 60s

  mvc:
    apiversion:
      # Framework-owned API versioning (Spring Framework 7). The version is the second path
      # segment, so /api/v1/chat keeps its shape while the version becomes a first-class mapping
      # dimension: an unsupported version is rejected with 400 naming the version, rather than
      # falling through to a 404 that looks like a wrong URL.
      #
      # `v1` is the default version, so a request that resolves no version at all is served as v1
      # rather than rejected. It matches SolrAssistantController.V1 — keep the two in step, since
      # nothing checks that the default names a version any handler actually declares. `required`
      # must be false for that: Spring refuses to start with `required: true` and a default
      # configured together.
      #
      # Note what this does not do. The version segment is still part of the URL template
      # (`/api/{version}` on the controller), so /api/chat is a 404 — no property relaxes a path
      # pattern — and PathApiVersionResolver returns whatever segment sits at the index rather than
      # null, so the default is not reached by dropping the segment either. Making unversioned URLs
      # resolve to v1 would need the controller mapped at both /api and /api/{version} plus an
      # ApiVersionResolver bean using PathApiVersionResolver's predicate constructor, which Spring
      # Boot does not expose as a property.
      use:
        path-segment: 1
      required: false
      default: "v1"
      detect-supported: true
  threads:
    virtual:
      enabled: true

logging:
  level:
    root: info
    org.springframework.ai: debug

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  # The document's Info block, bound straight into springdoc's OpenAPI model — configuration, not
  # code, so there is no @Configuration class to maintain for it. The version matches
  # SolrAssistantController.V1; nothing enforces that, so keep the two in step. No security scheme
  # is declared anywhere: the facade performs no inbound authentication by design (see
  # InboundSecurityConfiguration), and advertising one it does not enforce would misrepresent the
  # contract to generated clients.
  open-api:
    info:
      title: ${spring.application.name}
      version: v1
      description: |-
        REST facade over an Apache Solr MCP server. A chat model reaches Solr through MCP tools; this API exposes that assistant over HTTP so a user interface does not have to embed Spring AI itself.

        The facade is unauthenticated by design and is intended to run inside a trusted boundary. In the `mcp-http` profile, OAuth2 client credentials secure the outbound connection to Solr MCP only.
      license:
        name: Apache-2.0
        url: https://www.apache.org/licenses/LICENSE-2.0
server:
  port: 9090
