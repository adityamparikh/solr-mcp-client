spring:
  ai:
    mcp:
      client:
        stdio:
          connections:
            solr-mcp:
              # In this profile the client is also the server's launcher, so it owns the child
              # process spec. Absolute paths only: the child is launched relative to this process's
              # working directory, which differs between `bootRun` and `java -jar`.
              command: ${SOLR_MCP_COMMAND:java}
              args:
                - -jar
                - ${SOLR_MCP_JAR}
              # This is the SERVER's setting, not this client's. It must be declared here because
              # the MCP SDK does not pass the parent environment through: it inherits only an
              # allowlist (PATH, HOME, HOMEDRIVE, HOMEPATH, USERNAME), so a SOLR_URL exported in
              # the operator's shell would silently never reach the child.
              # In the mcp-http profile it is absent by design — a remote server owns its own config.
              #
              # The server's profile is deliberately not passed: it defaults to stdio on its own
              # (spring.profiles.active=${PROFILES:stdio}), and naming it here would only add a
              # second server-owned key that breaks quietly if the server renames it.
              env:
                SOLR_URL: ${SOLR_URL:http://localhost:8983/solr/}
