spring:
  # The canonical Spring AI stdio posture — "you must disable the banner and the console logging
  # to allow the STDIO transport to work" — applied to every launch of this profile so that no
  # console writer exists anywhere near a stdio transport, web mode and cli composition alike.
  main:
    banner-mode: off
  ai:
    mcp:
      client:
        stdio:
          connections:
            solr-mcp:
              # In this profile the client is also the server's launcher, so it owns the child
              # process spec. Absolute paths only: the child is launched relative to this process's
              # working directory, which differs between `bootRun` and `java -jar`.
              command: ${SOLR_MCP_COMMAND:java}
              args:
                - -jar
                - ${SOLR_MCP_JAR}
              # This is the SERVER's setting, not this client's. It must be declared here because
              # the MCP SDK does not pass the parent environment through: it inherits only an
              # allowlist (PATH, HOME, HOMEDRIVE, HOMEPATH, USERNAME), so a SOLR_URL exported in
              # the operator's shell would silently never reach the child.
              # In the mcp-http profile it is absent by design — a remote server owns its own config.
              #
              # The server's profile is deliberately not passed: it defaults to stdio on its own
              # (spring.profiles.active=${PROFILES:stdio}), and naming it here would only add a
              # second server-owned key that breaks quietly if the server renames it.
              env:
                SOLR_URL: ${SOLR_URL:http://localhost:8983/solr/}

logging:
  # All console logging is disabled for stdio MCP interactions. The threshold is Boot's supported
  # form of "console appender off" — an empty logging.pattern.console is NOT equivalent: Logback
  # rejects it and prints its own "Empty or null pattern" status error to the console. Quoted
  # because a bare OFF could be read as YAML's boolean.
  #
  # The cost is accepted knowingly: a child that dies or diagnostics of a failed startup print
  # nothing to the console — startup failures still abort via McpToolVerifier, per-request
  # failures surface as request errors, and logs still ship over OTLP where a collector is
  # configured (the threshold affects only the console appender). Keep this file in step with
  # application-mcp-stdio-docker.yml.
  threshold:
    console: "OFF"
